    Pagination:
      type: object
      required: [page, limit, hasMore]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        hasMore:
          type: boolean
          description: Whether another page may follow. It can be true when the next page is empty.
    Revoked:
      type: object
      required: [revoked]
      properties:
        revoked: { const: true }

    Connection:
      type: object
      required:
        [externalUserId, providerKey, integrationKey, authType, status, createdAt, updatedAt]
      properties:
        providerKey: { type: string }
        integrationKey: { type: string }
        externalUserId:
          type: string
          description: Your own ID for the user — with the integration, the connection's identity.
        providerUserId: { type: [string, 'null'] }
        authType: { type: string }
        status: { $ref: '#/components/schemas/CredentialStatus' }
        grantedScopes: { type: [array, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastRefreshedAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        lastErrorAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        disconnectedAt: { type: [string, 'null'], format: date-time }
    Session:
      type: object
      required: [sessionKey, providerKey, integrationKey, authType, status, createdAt, updatedAt]
      properties:
        sessionKey: { type: string }
        providerKey: { type: string }
        integrationKey: { type: string }
        externalUserId: { type: [string, 'null'] }
        providerUserId: { type: [string, 'null'] }
        authType: { type: string }
        status: { $ref: '#/components/schemas/CredentialStatus' }
        grantedScopes: { type: [array, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastRefreshedAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        lastErrorAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        disconnectedAt: { type: [string, 'null'], format: date-time }
    CredentialStatus:
      type: string
      enum: [active, pending, reauth_required, error, revoked, inactive]
    UserInfo:
      type: object
      required: [user, raw]
      properties:
        user:
          type: object
          additionalProperties: true
          description: The fields the identity config maps (e.g. `email`, `name`).
        raw:
          type: object
          additionalProperties: true
          description: The provider's userinfo response, secrets redacted.
        jti:
          type: [string, 'null']
          description: |
            On `claim` only: the starting sign-in token's `jti`, to match this identity to the
            token your backend issued (like an OIDC nonce); null for API-key-started flows.
    Integration:
      type: object
      required: [integrationId, providerId, providerKey, integrationKey, label]
      properties:
        integrationId: { type: string }
        providerId: { type: string }
        providerKey: { type: string }
        integrationKey: { type: string }
        label: { type: string }
        status: { type: string }
        enabled: { type: boolean }
        auths: { type: array, items: { type: string } }
        scopes:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        scopesByGroups:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        scopeIds: { type: array, items: { type: string } }
        webhookUrls:
          type: array
          items: { $ref: '#/components/schemas/IntegrationWebhookUrl' }
        deleteAt: { type: [string, 'null'], format: date-time }
        provider:
          oneOf:
            - $ref: '#/components/schemas/ProviderSummary'
            - type: 'null'
    ProviderSummary:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        slugs:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              version: { type: string }
        brandColors:
          type: array
          items: { $ref: '#/components/schemas/BrandColor' }
        brandImages:
          type: array
          items: { $ref: '#/components/schemas/BrandImage' }
    BrandColor:
      type: object
      required: [providerBrandColorId, name, role, hex]
      properties:
        providerBrandColorId: { type: string }
        name: { type: string }
        role: { type: string }
        hex: { type: string }
    BrandImage:
      type: object
      required: [providerBrandImageId, url, type, theme, color, description, sortOrder]
      properties:
        providerBrandImageId: { type: string }
        url: { type: string, format: uri }
        type: { type: string }
        theme: { type: string }
        color: { type: string }
        description: { type: string }
        sortOrder: { type: number }
    IntegrationWebhookUrl:
      type: object
      required: [integrationWebhookUrlId, url]
      properties:
        integrationWebhookUrlId: { type: string }
        url: { type: string, format: uri }
        isActive: { type: boolean }
    IdentityProvider:
      description: A token caller gets no `status`, `slugs` or `enabled`.
      allOf:
        - $ref: '#/components/schemas/ProviderSummary'
        - type: object
          properties:
            providerKey: { type: string }
            integrations:
              type: array
              items:
                type: object
                properties:
                  integrationKey: { type: string }
                  label: { type: string }
                  enabled: { type: boolean, description: API key only. }
    ConnectableProvider:
      type: object
      description: A provider with at least one integration a user can connect.
      required: [providerKey, name, brandColors, brandImages, integrations]
      properties:
        providerKey: { type: string, description: What `init` takes as the provider. }
        name: { type: string }
        brandColors:
          type: array
          items: { $ref: '#/components/schemas/BrandColor' }
        brandImages:
          type: array
          items: { $ref: '#/components/schemas/BrandImage' }
        integrations:
          type: array
          minItems: 1
          description: Usually one. Each entry is a separate connection for the user.
          items: { $ref: '#/components/schemas/ConnectableIntegration' }
    ConnectableIntegration:
      type: object
      required: [integrationKey, label, authTypes, connected, connectionStatus]
      properties:
        integrationKey:
          type: string
          description: Send it as `x-marram-integration-key` to `init`; the list doesn't say which one is the default.
        label: { type: string }
        authTypes:
          type: array
          minItems: 1
          items: { type: string }
          description: The values `init` accepts as `auth` for this integration, e.g. `["oAuth2"]`.
        connected:
          type: boolean
          description: True when `connectionStatus` is `active`.
        connectionStatus:
          oneOf:
            - $ref: '#/components/schemas/CredentialStatus'
            - type: 'null'
          description: |
            The user's connection to this integration, or null when there is none (or no user
            was named). `reauth_required` means a reconnect is needed. An expired access token
            still reads `active`: the proxy refreshes it on use.
    Webhook:
      type: object
      required: [webhookKey, status, createdAt, updatedAt]
      properties:
        webhookKey: { type: string }
        kind: { type: [string, 'null'] }
        status: { type: string }
        providerWebhookId: { type: [string, 'null'] }
        externalUserId: { type: [string, 'null'] }
        metadata: { type: [string, 'null'] }
        webhookData: { type: object, additionalProperties: true }
        registeredAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        lastErrorAt: { type: [string, 'null'], format: date-time }
        lastDeliveredAt:
          type: [string, 'null']
          format: date-time
          description: When an event last reached one of your webhook URLs, to within a minute; null until one has.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WebhookMutation:
      type: object
      required: [success, webhookKey]
      properties:
        success: { const: true }
        webhookKey: { type: string }
        providerWebhookId: { type: [string, 'null'] }
        kind: { type: [string, 'null'] }
    FormField:
      type: object
      description: One input on the hosted setup form; webhook fields first, then connection fields.
      required: [keyVal, name, type, required, isSecret]
      properties:
        providerWebhookFieldId: { type: string }
        providerConnectionFieldId: { type: string }
        keyVal: { type: string, description: The key to send the value under. }
        name: { type: string }
        type: { type: string }
        inputType: { type: string }
        helpUrl: { type: [string, 'null'] }
        fillStage: { type: string }
        defaultValue: {}
        deprecated: { type: boolean }
        required: { type: boolean }
        validationRules: {}
        isSecret: { type: boolean }
        sort: { type: number }
        allowHidden: { type: boolean }
        allowPrefill: { type: boolean }
        translations: {}
        options:
          type: array
          items:
            type: object
            properties:
              value: {}
              translations: {}
            additionalProperties: true
      additionalProperties: true

  headers:
    RequestId:
      description: Names this request in Marram's logs; quote it when asking for help.
      schema: { type: string }
    Timestamp:
      description: When the response was produced; signed together with the body.
      schema: { type: string, format: date-time }
    Signature:
      description: Hex HMAC-SHA256 over `timestamp ‖ body`; two comma-separated values during a key rotation.
      schema: { type: string }
    ErrorCode:
      description: The same `code` as the body. Present only on Marram's own errors — a proxied provider error never has it.
      schema: { type: string }
    VersionServed:
      description: The provider API version Marram used (`default` when unpinned).
      schema: { type: string }

  responses:
    Error:
      description: |
        A Marram error. Common codes: `MISSING_CREDENTIALS`, `INVALID_API_KEY`,
        `API_KEY_EXPIRED`, `IP_NOT_ALLOWED` (401);
        `MISSING_CONNECTION_KEY`, `MISSING_SESSION_KEY`, `INTEGRATION_KEY_REQUIRED` (400);
        `PROVIDER_NOT_FOUND`, `INTEGRATION_NOT_FOUND`, `CONNECTION_NOT_FOUND` (404);
        `METHOD_NOT_ALLOWED` (405, with an `Allow` header); `CONFLICT` (409);
        `LIMIT_EXCEEDED`, `RATE_LIMITED` (429; `RATE_LIMITED` carries `Retry-After`);
        `PROVIDER_UNREACHABLE`, `REFRESH_FAILED`, `PROVIDER_RESPONSE_TOO_LARGE` (502; the last
        for a provider response over 25 MB); `PROVIDER_TIMEOUT` (504).
      headers:
        x-marram-request-id: { $ref: '#/components/headers/RequestId' }
        x-marram-timestamp: { $ref: '#/components/headers/Timestamp' }
        x-marram-hmac-256: { $ref: '#/components/headers/Signature' }
        x-marram-error-code: { $ref: '#/components/headers/ErrorCode' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
